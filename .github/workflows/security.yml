name: Security

on:
  pull_request:
    branches: [staging, main]
  schedule:
    - cron: "0 1 * * 1" # Senin 08.00 WIB
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CodeQL dan dependency-review tidak dipakai: butuh GitHub Advanced Security untuk repo private (CLAUDE.md bagian 10).
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # gitleaks-action membaca daftar commit PR untuk menentukan rentang scan.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm audit (gagal di level high ke atas)
        run: pnpm audit --audit-level high
