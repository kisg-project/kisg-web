name: DB

on:
  pull_request:
    branches: [staging, main]
    paths:
      - "supabase/**"
      - "src/lib/supabase/database.types.ts"

concurrency:
  group: db-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cek folder supabase
        id: check
        run: |
          if [ -f supabase/config.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Folder supabase/ belum ada. Job database aktif mulai Fase 2."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      # Fase 2: supabase start, terapkan migrasi dari nol, test RLS, supabase db lint,
      # cek database.types.ts sama dengan hasil generate, dan deteksi migrasi destruktif.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.check.outputs.ready == 'true'
      - name: Migrasi dari nol dan test RLS
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase start
          supabase db reset
          supabase test db
          supabase db lint --level warning
