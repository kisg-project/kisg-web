name: DB

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - "supabase/**"
      - "src/lib/supabase/database.types.ts"
      - ".github/workflows/db.yml"

concurrency:
  group: db-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0

      - name: Migrasi destruktif wajib berlabel
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          changed="$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- supabase/migrations)"
          if [ -z "$changed" ]; then echo "Tidak ada migrasi baru."; exit 0; fi
          # Migrasi lama tidak boleh diubah (CLAUDE.md bagian 13): hanya file baru yang boleh muncul.
          modified="$(git diff --name-only --diff-filter=M "$BASE_SHA" HEAD -- supabase/migrations)"
          if [ -n "$modified" ]; then
            echo "::error::Migrasi yang sudah ada tidak boleh diubah. Buat migrasi baru: $modified"; exit 1
          fi
          if grep -Eiq '\b(drop (table|column|type|schema|function)|rename (to|column)|alter column [a-z_]+ (set data )?type)\b' $changed; then
            case ",$LABELS," in
              *",migration:destructive,"*) echo "::warning::Migrasi destruktif disetujui lewat label." ;;
              *) echo "::error::Migrasi destruktif terdeteksi. Pasang label migration:destructive setelah disetujui owner."; exit 1 ;;
            esac
          fi

      - name: Supabase lokal, migrasi dari nol, seed
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          supabase db reset

      - name: Test RLS (pgTAP)
        run: supabase test db

      - name: Lint database
        run: supabase db lint --level warning --fail-on warning

      - name: Tipe TypeScript sama dengan schema
        run: |
          supabase gen types --lang typescript --schema public > /tmp/database.types.ts
          mkdir -p src/lib/supabase
          if ! diff -q /tmp/database.types.ts src/lib/supabase/database.types.ts > /dev/null 2>&1; then
            cp /tmp/database.types.ts database.types.ts
            echo "::error::src/lib/supabase/database.types.ts belum sama dengan schema. Ambil artifact database-types, salin ke src/lib/supabase/, lalu commit."
            echo "TYPES_DIFF=1" >> "$GITHUB_ENV"
          fi

      - name: Unggah tipe hasil generate
        if: env.TYPES_DIFF == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-types
          path: database.types.ts
          retention-days: 7

      - name: Gagal kalau tipe belum sama
        if: env.TYPES_DIFF == '1'
        run: exit 1
