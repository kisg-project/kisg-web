name: Backup

# Supabase Free tidak punya backup otomatis (CLAUDE.md bagian 10).
# Harian: pg_dump production, dienkripsi, disimpan sebagai artifact.
# Harian juga: ping staging supaya project tidak dijeda (Supabase Free menjeda setelah 7 hari tanpa aktivitas).
on:
  schedule:
    - cron: "0 19 * * *" # 02.00 WIB
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup-production:
    name: backup-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Cek secret
        id: check
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::Secret PRODUCTION_SUPABASE_DB_URL atau BACKUP_PASSPHRASE belum diisi. Backup dilewati (aktif mulai Fase 2)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.check.outputs.ready == 'true'
      - name: Dump dan enkripsi
        if: steps.check.outputs.ready == 'true'
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" --data-only -f data.sql
          tar czf "backup-$stamp.tar.gz" schema.sql data.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "backup-$stamp.tar.gz.gpg" "backup-$stamp.tar.gz"
          rm -f schema.sql data.sql "backup-$stamp.tar.gz"
      - name: Simpan backup terenkripsi
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-production
          path: backup-*.tar.gz.gpg
          retention-days: 30

  ping-staging:
    name: ping-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping API staging
        run: |
          if [ -z "$STAGING_URL" ] || [ -z "$STAGING_ANON_KEY" ]; then
            echo "::notice::Secret staging belum diisi. Ping dilewati (aktif mulai Fase 2)."; exit 0
          fi
          curl -fsS -o /dev/null -w "%{http_code}\n" "$STAGING_URL/rest/v1/" -H "apikey: $STAGING_ANON_KEY"
