name: Deploy DB staging

# Merge ke staging menerapkan migrasi ke Supabase staging. Production lewat deploy-production.yml.
on:
  push:
    branches: [staging]
    paths:
      - "supabase/migrations/**"

concurrency:
  group: deploy-db-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-staging:
    name: migrate-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cek konfigurasi
        id: check
        run: |
          if [ ! -f supabase/config.toml ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Folder supabase/ atau secret staging belum ada. Aktif mulai Fase 2."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.check.outputs.ready == 'true'
      - name: supabase db push ke staging
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
