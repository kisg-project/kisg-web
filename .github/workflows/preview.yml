name: Preview

# Smoke E2E dan Lighthouse ke URL Preview Vercel setelah deploy berhasil.
on:
  deployment_status:

concurrency:
  group: preview-${{ github.event.deployment.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: read

jobs:
  preview:
    name: preview
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      # Preview Vercel dilindungi Vercel Authentication. Bypass memakai "Protection Bypass for Automation".
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Cek secret bypass
        id: bypass
        run: |
          if [ -z "$VERCEL_BYPASS" ]; then
            echo "::warning::Secret VERCEL_AUTOMATION_BYPASS_SECRET belum diisi. Smoke test preview dilewati (lihat docs/ci-cd.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.bypass.outputs.ready == 'true'
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.bypass.outputs.ready == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.bypass.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.bypass.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Smoke E2E (Chromium)
        if: steps.bypass.outputs.ready == 'true'
        env:
          E2E_EXTRA_HEADERS: '{"x-vercel-protection-bypass":"${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}","x-vercel-set-bypass-cookie":"true"}'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --project=chromium e2e/site/home.spec.ts e2e/site/headers-and-errors.spec.ts
      - name: Lighthouse CI
        if: steps.bypass.outputs.ready == 'true'
        run: |
          npx --yes @lhci/cli@0.16.1 autorun \
            --collect.url="$E2E_BASE_URL" \
            --collect.settings.extraHeaders="{\"x-vercel-protection-bypass\":\"$VERCEL_BYPASS\"}" \
            --upload.target=filesystem --upload.outputDir=lhci-report
      - name: Komentar hasil Lighthouse ke PR
        if: always() && steps.bypass.outputs.ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const sha = context.payload.deployment.sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: sha,
            });
            if (!prs.length) return;
            let body = `### Lighthouse (preview ${sha.slice(0, 7)})\n\n`;
            try {
              const manifest = JSON.parse(fs.readFileSync("lhci-report/manifest.json", "utf8"));
              body += "| URL | Performance | Accessibility | Best practices | SEO |\n|---|---|---|---|---|\n";
              for (const run of manifest.filter((item) => item.isRepresentativeRun)) {
                const s = run.summary;
                const pct = (value) => Math.round(value * 100);
                body += `| ${run.url} | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s["best-practices"])} | ${pct(s.seo)} |\n`;
              }
            } catch {
              body += "Laporan Lighthouse tidak tersedia. Lihat log workflow.";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prs[0].number, body,
            });
