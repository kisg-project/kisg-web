name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  # Halaman /dev/ui hanya aktif di build CI untuk E2E, tidak di Vercel.
  ENABLE_DEV_UI: "1"
  # Email aplikasi di E2E dikirim ke Mailpit milik Supabase lokal, bukan Brevo.
  MAILPIT_URL: http://127.0.0.1:54324
  # Kamera palsu di E2E tidak berisi wajah asli: deteksi wajah dan kedip diganti tombol uji.
  # Hanya build CI. Build production (deploy-production.yml) tidak memakai variabel ini.
  NEXT_PUBLIC_E2E_FACE_STUB: "1"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        name: Deteksi perubahan selain dokumen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -Evq '^(docs/|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hanya dokumen yang berubah. Job kode dilewati."
          fi

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Judul PR mengikuti Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|perf|build|ci|style|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "Judul PR valid: $TITLE"
          else
            echo "::error::Judul PR harus Conventional Commits, misal 'feat: tambah simulasi KPR'. Sekarang: $TITLE"
            exit 1
          fi

  static:
    name: static
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:copy
      - run: pnpm format:check
      - run: pnpm test:coverage
      - name: Unggah coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: build
    needs: [changes, static]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Halaman website di-prerender dari database (Fase 3), jadi build butuh Supabase lokal. Data
      # konten memakai ID tetap dari migrasi, sehingga sama dengan database di job E2E.
      - name: Supabase lokal
        uses: ./.github/actions/supabase-local
      - name: Cache build Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          # Hash migrasi ikut di kunci: cache data fetch saat prerender berisi konten database, jadi
          # hanya boleh dipakai ulang kalau migrasi (isi database) sama persis.
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('supabase/migrations/**', 'supabase/seed.sql') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('supabase/migrations/**', 'supabase/seed.sql') }}-
      - run: pnpm build
      - name: Unggah hasil build untuk E2E
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/
          include-hidden-files: true
          retention-days: 3

  e2e:
    # Keputusan owner (opsi B, Fase 2): setiap PR cukup Chromium di 1 runner (termasuk cek responsif
    # 320 sampai 1440 px). Tiga browser x 3 shard hanya untuk PR akhir fase berlabel e2e:full.
    # Label dibaca saat event, jadi pasang label lalu push.
    name: e2e (${{ matrix.shard }}/${{ contains(github.event.pull_request.labels.*.name, 'e2e:full') && 3 || 1 }})
    needs: [changes, build]
    # E2E di setiap PR. Saat merge ke main cukup build, karena PR sudah menjalankan E2E.
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'e2e:full') && '[1, 2, 3]' || '[1]') }}
    env:
      # PR biasa hanya Chromium: dependency sistem WebKit (codec video) besar dan mirror apt runner
      # kadang sangat lambat. WebKit dipasang hanya untuk e2e:full.
      BROWSERS: ${{ contains(github.event.pull_request.labels.*.name, 'e2e:full') && 'chromium webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unduh hasil build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: .next/
      - name: Versi Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache browser Playwright
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ env.BROWSERS }}
      - name: Pasang browser
        # apt di runner kadang macet. Gagal cepat lebih hemat menit daripada menunggu batas job.
        timeout-minutes: 12
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps $BROWSERS
      - name: Pasang dependency sistem browser
        # apt di runner kadang macet. Gagal cepat lebih hemat menit daripada menunggu batas job.
        timeout-minutes: 12
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps $BROWSERS
      - name: Supabase lokal
        uses: ./.github/actions/supabase-local
      - name: E2E
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ contains(github.event.pull_request.labels.*.name, 'e2e:full') && 3 || 1 }} ${{ contains(github.event.pull_request.labels.*.name, 'e2e:full') && ' ' || '--project=chromium' }}
      - name: Unggah laporan Playwright
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            blob-report/
            test-results/
          retention-days: 14
