name: Keepalive Supabase

# Supabase Free menjeda project setelah 7 hari tanpa aktivitas, dan website serta portal ikut mati.
# Robot ini membaca satu baris data publik dari API production setiap hari supaya project tetap aktif,
# walaupun tidak ada yang membuka website atau portal. Kalau gagal, issue dibuat otomatis.
on:
  schedule:
    - cron: "17 2 * * *" # 09.17 WIB setiap hari
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ping:
    name: ping
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Ping API Supabase production
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Secret PRODUCTION_SUPABASE_URL atau PRODUCTION_SUPABASE_PUBLISHABLE_KEY belum diisi."
            exit 1
          fi
          for attempt in 1 2 3; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/site_settings?select=key&limit=1" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY")" || code=000
            echo "Percobaan $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase production tidak menjawab. Cek apakah project dijeda di dashboard Supabase."
          exit 1

      - name: Buat issue kalau gagal
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Keepalive Supabase gagal";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 50,
            });
            if (open.data.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Ping harian ke Supabase production gagal (${new Date().toISOString().slice(0, 10)}). Buka dashboard Supabase, pastikan project tidak dijeda, lalu jalankan ulang workflow Keepalive Supabase.`,
            });
