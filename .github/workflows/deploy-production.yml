name: Deploy production

# Pengganti approval GitHub Environments (tidak tersedia di GitHub Free untuk repo private).
# Dijalankan manual dari tab Actions, hanya dari main, dengan mengetik "production".
# Urutan: migrasi database dulu, lalu app versi baru (CLAUDE.md bagian 10).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ketik "production" untuk melanjutkan'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - name: Konfirmasi
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy production hanya dari branch main."; exit 1
          fi
          if [ "$CONFIRM" != "production" ]; then
            echo "::error::Konfirmasi salah. Ketik production."; exit 1
          fi
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name belum diisi."; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrasi database production
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::notice::Belum ada migrasi (aktif mulai Fase 2)."; exit 0
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Secret database production belum diisi."; exit 1
          fi
          npx --yes supabase@3.2.0 link --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@3.2.0 db push
      - name: Build dan deploy ke Vercel production
        run: |
          npx --yes vercel@66.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@66.2.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@66.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
